# =====================================================================
#  .streamlit/config.toml  -  Tema "Cupang Senja" untuk SiCupang
#  Simpan di:  <folder project>/.streamlit/config.toml
#  Lalu STOP dan jalankan ulang: streamlit run main.py
#
#  Konsep:
#    - Sidebar biru malam (gelap)   = dasar akuarium, jadi "jangkar" tampilan
#    - Halaman biru langit pucat    = air jernih, bukan putih polos
#    - Input & tabel putih bersih   = menonjol seperti kartu di atas air
#    - Aksen coral-magenta          = sirip ekor cupang
#    - Aksen teal                   = kilau sisik
# =====================================================================

[theme]
base = "light"

# Merah-magenta sirip cupang (tombol primary, progress, tab aktif)
primaryColor = "#F0436F"

# Halaman: biru langit/aqua pucat (sengaja agak berwarna, bukan putih)
backgroundColor = "#DDEEF8"

# Input, tabel, expander: putih bersih -> tampak "timbul" di atas latar biru
secondaryBackgroundColor = "#FFFFFF"

# Teks utama: biru malam pekat
textColor = "#0B2545"

linkColor = "#0B8A9E"

# Garis tepi: biru sedang, cukup terlihat supaya kartu punya bentuk
borderColor = "#A9CBE3"
showWidgetBorder = true

baseRadius = "full"
font = "sans serif"

codeBackgroundColor = "#CFE5F3"

# Grafik: coral, teal, biru royal, emas, ungu, oranye
chartCategoricalColors = ["#F0436F", "#0FB5A6", "#2F6FDE", "#F5A524", "#8B5CF6", "#F97316"]
chartSequentialColors = ["#E3F2FB", "#BFE0F3", "#94CAEA", "#68B0DE", "#3F94CC", "#2677B2", "#175C93", "#0F4574", "#0A3155", "#061F38"]

# ---------------------------------------------------------------------
# Sidebar: BIRU MALAM (di sinilah warna gelapnya)
# ---------------------------------------------------------------------
[theme.sidebar]
backgroundColor = "#0B2545"
secondaryBackgroundColor = "#143A66"
textColor = "#E6F1FA"
borderColor = "#1F4B7D"
primaryColor = "#2DD4BF"
linkColor = "#5EEAD4"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
