# =====================================================================
#  .streamlit/config.toml  -  Tema "Cupang" untuk SiCupang
#  Simpan file ini di:  <folder project>/.streamlit/config.toml
#  (sejajar dengan secrets.toml), lalu jalankan ulang: streamlit run main.py
#
#  Konsep warna:
#    - Latar biru laut gelap  = suasana air akuarium malam hari
#    - Aksen merah-magenta    = sirip ekor cupang (tombol, progress, pilihan aktif)
#    - Aksen teal             = kilau sisik biru cupang (link, sidebar)
# =====================================================================

[theme]
base = "dark"

# Warna utama: merah-magenta sirip cupang (tombol "primary", progress bar, tab aktif)
primaryColor = "#FF3D6E"

# Latar halaman: biru laut dalam
backgroundColor = "#0A1A2F"

# Latar kartu, input, tabel, container border: biru akuarium
secondaryBackgroundColor = "#12294A"

# Teks: putih kebiruan (lembut di mata)
textColor = "#E6F1FA"

# Warna link
linkColor = "#2DD4BF"

# Garis tepi kartu / input / tabel
borderColor = "#1F4570"
showWidgetBorder = true

# Sudut membulat seperti sirip
baseRadius = "large"

# Font
font = "sans serif"

# Latar blok kode (jarang dipakai di aplikasi ini)
codeBackgroundColor = "#0D2240"

# Warna grafik bawaan (kalau suatu saat tidak diatur manual di kode):
# merah sirip, teal sisik, biru, kuning emas, ungu, oranye
chartCategoricalColors = ["#FF3D6E", "#2DD4BF", "#3B82F6", "#FBBF24", "#A78BFA", "#FB923C"]

# ---------------------------------------------------------------------
# Sidebar: sedikit lebih gelap supaya terasa seperti "dasar akuarium"
# ---------------------------------------------------------------------
[theme.sidebar]
backgroundColor = "#07131F"
secondaryBackgroundColor = "#0F2540"
borderColor = "#1B3B60"
primaryColor = "#2DD4BF"

# ---------------------------------------------------------------------
# Pengaturan lain
# ---------------------------------------------------------------------
[client]
toolbarMode = "minimal"      # sembunyikan menu developer, tampilan lebih bersih

[browser]
gatherUsageStats = false
