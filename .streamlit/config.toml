# =====================================================================
#  .streamlit/config.toml  -  Tema "Cupang Terang" untuk SiCupang
#  Simpan di:  <folder project>/.streamlit/config.toml
#  Lalu jalankan ulang: streamlit run main.py
#
#  Konsep warna (versi terang & elegan):
#    - Latar putih kebiruan lembut  = air akuarium pagi hari
#    - Aksen coral-magenta          = sirip ekor cupang (tombol, progress)
#    - Aksen teal                   = kilau sisik biru (link, sidebar)
#    - Sidebar biru es              = beda tipis dari halaman, tidak kaku
# =====================================================================

[theme]
base = "light"

# Warna utama: coral-magenta lembut (tombol primary, progress bar, tab aktif)
primaryColor = "#E8456F"

# Latar halaman: putih kebiruan, tidak silau seperti putih polos
backgroundColor = "#F5FAFD"

# Latar input, tabel, expander: biru es pucat (kontras halus dengan halaman)
secondaryBackgroundColor = "#E8F2F9"

# Teks: biru malam, lebih hangat & elegan dibanding hitam pekat
textColor = "#12304D"

# Warna link: teal
linkColor = "#0F9D8F"

# Garis tepi halus
borderColor = "#CFE1EE"
showWidgetBorder = true
showSidebarBorder = false

# Sudut membulat penuh, seperti sirip
baseRadius = "full"

# Font
font = "sans serif"

# Latar blok kode
codeBackgroundColor = "#EAF3FA"

# Warna grafik bawaan: coral, teal, biru, emas, lavender, oranye
chartCategoricalColors = ["#E8456F", "#0F9D8F", "#3B82F6", "#F5A524", "#8B7CF6", "#F97316"]

# Warna sekuensial (heatmap dll): biru es -> biru laut
chartSequentialColors = ["#EAF4FB", "#C5E0F2", "#9CCBE8", "#6FB1DB", "#4796CA", "#2C79B0", "#1E5E92", "#144672", "#0C3152", "#071F37"]

# ---------------------------------------------------------------------
# Sidebar: biru es lembut, teal sebagai penanda menu aktif
# ---------------------------------------------------------------------
[theme.sidebar]
backgroundColor = "#E9F4FA"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#CBE0EE"
textColor = "#12304D"
primaryColor = "#0F9D8F"
linkColor = "#0F9D8F"

# ---------------------------------------------------------------------
# Pengaturan lain
# ---------------------------------------------------------------------
[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
